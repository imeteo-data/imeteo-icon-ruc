name: CI

# PR gate: builds the Rust extraction extension and runs the test suite
# against it, so extraction changes are proven on the real backend before
# merge (the synthetic-GRIB tests in tests/test_extract.py need no data/raw).
# The push paths filter keeps the every-15-min forecast auto-commits from
# triggering CI.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["pipeline/**", "extract_rs/**", "tests/**", "main.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install eccodes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-tools

      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Format check (ruff)
        run: uvx ruff format --check .

      - name: Install Rust toolchain (pinned by extract_rs/rust-toolchain.toml)
        # Plain rustup reads rust-toolchain.toml from the working directory
        # (dtolnay/rust-toolchain does not). RUSTUP_TOOLCHAIN is exported so
        # the maturin build below — invoked from the repo root, outside the
        # toml's reach — resolves to the same pinned toolchain.
        working-directory: extract_rs
        run: |
          rustup toolchain install
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extract_rs

      - name: Format check
        working-directory: extract_rs
        run: cargo fmt --check

      - name: Clippy
        working-directory: extract_rs
        env:
          # pyo3's build script probes a Python interpreter; point it at the
          # uv-synced venv so it can't pick up a runner Python that pyo3
          # doesn't support yet.
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build Rust extraction extension
        run: uv run maturin develop --release --manifest-path extract_rs/Cargo.toml

      - name: Assert Rust backend is active
        run: uv run python -c "from pipeline import extract; assert extract._RUST_AVAILABLE, 'extract_rs not importable'"

      - name: Run tests
        run: uv run pytest tests/ -q
