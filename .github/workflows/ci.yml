name: CI

# PR gate: builds the Rust extraction extension and runs the test suite
# against it, so extraction changes are proven on the real backend before
# merge (the synthetic-GRIB tests in tests/test_extract.py need no data/raw).
# The push paths filter keeps the every-15-min forecast auto-commits from
# triggering CI.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["pipeline/**", "extract_rs/**", "tests/**", "main.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install eccodes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-tools

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extract_rs

      - name: Build Rust extraction extension
        run: uv run maturin develop --release --manifest-path extract_rs/Cargo.toml

      - name: Assert Rust backend is active
        run: uv run python -c "from pipeline import extract; assert extract._RUST_AVAILABLE, 'extract_rs not importable'"

      - name: Run tests
        run: uv run pytest tests/ -q
