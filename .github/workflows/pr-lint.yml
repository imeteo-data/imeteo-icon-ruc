name: PR Lint

# Release notes are generated by git-cliff from the squash commit, which
# carries the PR title and body — so both must follow the PR template.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Rapid title/body edits each fire an `edited` event — only the newest matters.
concurrency:
  group: pr-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event.pull_request.user.type != 'Bot'
    # Public repo: PR jobs stay hosted (meta ADR-0007), never choose-runner,
    # which vars.RUNNER_LABEL routes to the self-hosted mac-mini.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/lint_pr.py
