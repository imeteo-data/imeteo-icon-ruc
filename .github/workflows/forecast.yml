name: Forecast & Deploy

on:
  schedule:
    # Every 15 min. GitHub delays/drops scheduled runs under load, so firing
    # often + backfilling (below) keeps gaps small. A fire that finds nothing
    # new is cheap: completeness checks only, no commit, no deploy.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of recent runs to process"
        required: false
        default: "12"
      force:
        description: "Force reprocess even if already complete (no --backfill)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Concurrency is scoped per job, NOT workflow-wide. A workflow-level group
# couples data refresh to publishing: on 2026-08-06 a Pages deploy wedged in
# the `waiting` state on the github-pages environment gate (an un-approvable
# pending deployment left behind by a GitHub Actions incident) and held the
# group indefinitely. Since only one run may sit pending per group, every
# subsequent fire queued and was cancelled by the next — 34 straight
# cancellations, no forecast job ran for 14h, and the site froze. Per-job
# groups keep a stuck deploy from ever blocking the data pipeline again.

jobs:
  choose-runner:
    uses: ./.github/workflows/choose-runner.yml

  forecast:
    needs: choose-runner
    runs-on: ${{ needs.choose-runner.outputs.runner }}
    # Serialize data refresh against itself: concurrent runs would race on the
    # same commit/push to main. Never cancel-in-progress — a mid-flight
    # forecast holds downloaded GRIBs and is close to committing.
    concurrency:
      group: forecast-data
      cancel-in-progress: false
    # Higher than the old 15: a backfill after a long scheduler gap may process
    # several runs. If it still overruns, the next fire continues where it left
    # off (the work is self-healing), so this is just a safety net.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Install eccodes
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-tools

      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: uv sync --group dev

      # The Rust extension is a ~5-10x speedup with an automatic xarray/cfgrib
      # fallback in pipeline/extract.py. The step below makes the fast-path build
      # work on BOTH runners; the build stays continue-on-error so a Rust hiccup
      # degrades to xarray rather than stopping the forecast. ci.yml is the gate
      # that fails loudly on Rust regressions — not this production pipeline.
      - name: Put Rust toolchain on PATH (pinned by extract_rs/rust-toolchain.toml)
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Self-hosted mac-mini: the real cargo/rustc (Homebrew rust 1.97.x,
            # ~ the pinned 1.97.0) live in /opt/homebrew/bin, which is NOT on the
            # runner PATH — and ~/.cargo/bin holds only dangling rustup proxies.
            # Expose Homebrew so the maturin build below finds cargo; crates.io
            # and pkg-config eccodes are both reachable from this host.
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          else
            # GitHub-hosted Linux: rustup is preinstalled. Plain rustup reads
            # rust-toolchain.toml from extract_rs/ (dtolnay/rust-toolchain does
            # not); export RUSTUP_TOOLCHAIN so the maturin build (invoked from the
            # repo root, outside the toml's reach) uses the same pin.
            ( cd extract_rs && rustup toolchain install )
            echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
          fi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: extract_rs

      - name: Build Rust extraction extension
        continue-on-error: true
        run: uv run maturin develop --release --manifest-path extract_rs/Cargo.toml

      - name: Fetch & backfill recent runs
        # Process the newest N runs. Normally uses --backfill to skip already-complete
        # runs (cheap). Pass force=true via workflow_dispatch to reprocess unconditionally.
        run: |
          RUNS="${{ github.event.inputs.runs || '12' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            uv run python main.py --runs "$RUNS" --no-wait
          else
            uv run python main.py --runs "$RUNS" --backfill
          fi

      - name: Trim old runs (keep newest 12 JSONs)
        run: uv run python cleanup.py --keep-last 12

      - name: Commit & push new forecasts if anything changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts
          if git diff --cached --quiet; then
            echo "No forecast changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: refresh forecasts $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Resilient to a previous fire having pushed while this one ran.
          if git pull --rebase --autostash origin main && git push; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "push failed (concurrent update?); next run will backfill"
            git rebase --abort 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: forecast
    # Only rebuild Pages when forecasts actually changed, so the frequent cron
    # doesn't trigger a deploy on every fire — but a manual run (workflow_dispatch)
    # always deploys, so site/code changes can be pushed live on demand.
    if: needs.forecast.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Publishing is last-one-wins: the job always deploys the current tip of
    # main, so a newer deploy fully supersedes an older one and cancelling a
    # superseded deploy loses nothing.
    # NOTE: this group's guaranteed benefit is isolation — a wedged deploy can
    # no longer stall the forecast job, since that lives in its own group.
    # Whether cancel-in-progress also evicts a job stuck in the environment
    # `waiting` gate is UNVERIFIED (not exercised by the 2026-08-07 recovery).
    # If it doesn't, a future wedge would confine the cancel-cascade to deploys:
    # data keeps committing, but the site could freeze until someone runs
    # `gh run cancel <id>` on the waiting run.
    concurrency:
      group: forecast-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest changes from remote
        run: git fetch origin main && git reset --hard origin/main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      # The Pages backend intermittently fails fresh deployments with
      # "Deployment failed, try again later" (~5-10% of the ~50 deploys/day;
      # the forecast job is unaffected and the site keeps serving the previous
      # version). Treat the first failure as the transient it is and retry
      # once before going red.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying failed deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy after transient Pages failure
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
