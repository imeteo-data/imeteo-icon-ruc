name: Forecast & Deploy

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast-deploy
  cancel-in-progress: false

jobs:
  choose-runner:
    uses: ./.github/workflows/choose-runner.yml

  forecast:
    needs: choose-runner
    runs-on: ${{ needs.choose-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install eccodes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-tools

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: uv sync --group dev

      - name: Fetch latest forecast run
        run: uv run python main.py --runs 1

      - name: Trim old runs (keep newest 12 JSONs)
        run: uv run python cleanup.py --keep-last 12

      - name: Commit new forecasts if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts
          if git diff --cached --quiet; then
            echo "No forecast changes."
          else
            git commit -m "auto: refresh forecasts $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest changes from remote
        run: git fetch origin main && git reset --hard origin/main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
