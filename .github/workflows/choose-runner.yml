name: Choose Runner

on:
  workflow_call:
    outputs:
      runner:
        description: "Runner label: self-hosted when mac-mini-m2 is online, ubuntu-latest otherwise"
        value: ${{ jobs.pick.outputs.runner }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `administration: read` is REQUIRED to list this repo's self-hosted
    # runners. It is not part of the default GITHUB_TOKEN even in write-all
    # mode, so without it the runners API returns 403 and every fire silently
    # falls back to ubuntu-latest — which is exactly why the mac-mini offload
    # never took effect (see imeteo-icon-ruc#14).
    permissions:
      contents: read
      administration: read
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check self-hosted runner availability
        id: check
        env:
          OVERRIDE: ${{ vars.RUNNER_LABEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${OVERRIDE:-}" ]; then
            echo "Runner: $OVERRIDE (vars.RUNNER_LABEL override)"
            echo "runner=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # mac-mini-m2 is registered at the REPO level for this repo. Query
          # fails loud: an API/permission error must never masquerade as
          # "offline" and hide a broken runner (org CI convention).
          if ! status=$(gh api "repos/${{ github.repository }}/actions/runners" \
                          --jq '.runners[] | select(.name=="mac-mini-m2") | .status'); then
            echo "::warning::Could not query self-hosted runners (API/permission error); falling back to ubuntu-latest"
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="${status:-offline}"
          if [ "$status" = "online" ]; then
            echo "runner=self-hosted" >> "$GITHUB_OUTPUT"
            echo "Using self-hosted runner (mac-mini-m2 is online)"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "Falling back to ubuntu-latest (mac-mini-m2 is ${status})"
          fi
