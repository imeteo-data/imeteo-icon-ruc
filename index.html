<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON-D2-RUC · Bratislava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
:root{
  --bg:#0b0e14; --panel:#151a23; --raised:#1b2230; --hair:#232c3a;
  --text:#e6edf5; --muted:#8a96a8; --faint:#5b6675;
  --precip:#3b9eff; --precip-rgb:59,158,255;
  --wind:#5fb6c9; --wind-rgb:95,182,201;
  --temp:#ffb454; --temp-rgb:255,180,84;
  --alert:#ff5c5c; --ok:#4ade80; --thr:#ffd92a;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --radius:10px; --hairw:1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;}
body{padding-bottom:var(--s5);}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;}
.lbl{font-family:var(--sans);text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:600;color:var(--muted);}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
a{color:inherit;}

/* ===== status bar ===== */
/* opaque (no backdrop-filter): blur recomputes every scroll frame on mobile
   and is a primary cause of scroll jank / flicker. */
.statusbar{position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:var(--hairw) solid var(--hair);
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--s3) var(--s4);flex-wrap:wrap;}
.sb-id{display:flex;align-items:center;gap:var(--s2);font-family:var(--mono);
  font-size:13px;font-weight:500;letter-spacing:.02em;}
.led{width:9px;height:9px;border-radius:2px;background:var(--ok);
  box-shadow:0 0 8px rgba(74,222,128,.7);flex:none;
  animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.sb-loc{color:var(--muted);}
.sb-degraded{display:none;color:var(--bg);background:var(--thr);font-family:var(--mono);
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;}
.sb-spacer{flex:1 1 auto;}
.sb-meta{display:flex;align-items:center;gap:var(--s4);font-family:var(--mono);
  font-size:12px;color:var(--muted);white-space:nowrap;}
.sb-meta b{color:var(--text);font-weight:500;}
.runswitch{position:relative;}
.runswitch select{appearance:none;-webkit-appearance:none;
  font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);
  background:var(--raised);border:var(--hairw) solid var(--hair);
  border-radius:8px;padding:7px 30px 7px 12px;cursor:pointer;letter-spacing:.02em;}
.runswitch select:hover{border-color:#33425a;}
.runswitch select:focus{outline:none;border-color:var(--precip);}
.runswitch::after{content:"";position:absolute;right:12px;top:50%;
  width:6px;height:6px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(45deg);
  pointer-events:none;}

/* ===== layout ===== */
.wrap{max-width:1180px;margin:0 auto;padding:var(--s4);}
.section{margin-top:var(--s5);}
.section-head{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3);}
.section-head .sub{font-family:var(--mono);font-size:11px;color:var(--faint);}

/* entrance anim */
.anim{opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes rise{to{opacity:1;transform:none;}}

/* ===== answer layer ===== */
.answers{display:flex;flex-direction:column;gap:var(--s3);}
.readout-panel{background:var(--panel);border:var(--hairw) solid var(--hair);
  border-radius:var(--radius);position:relative;overflow:hidden;}
.readout-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--muted));}
.rp-body{padding:var(--s4) var(--s4) var(--s4) calc(var(--s4) + 3px);}
.rp-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  margin-bottom:var(--s2);}
.rp-tag{font-family:var(--sans);text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:600;color:var(--accent);}
.rp-unit{font-family:var(--mono);font-size:11px;color:var(--faint);}
.rp-head{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.18;
  letter-spacing:-.01em;color:var(--text);}
.rp-head .now{color:var(--accent);}
.rp-head .accent{color:var(--accent);}
.rp-sub{margin-top:6px;font-family:var(--mono);font-size:13px;color:var(--muted);
  line-height:1.5;letter-spacing:.01em;}
.rp-sub .dim{color:var(--faint);}
.rp-sub .accent{color:var(--accent);}
.rp-sub b{color:var(--text);font-weight:600;}
.rp-miss .rp-head{color:var(--faint);font-size:18px;}
@media(min-width:760px){.rp-head{font-size:26px;}}
@media(max-width:480px){.rp-head{font-size:20px;}}

/* expander */
.rp-expander{display:flex;align-items:center;gap:8px;width:100%;
  min-height:44px;padding:0 var(--s4) 0 calc(var(--s4) + 3px);
  border-top:var(--hairw) solid var(--hair);
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);transition:color .12s;}
.rp-expander:hover{color:var(--muted);}
.rp-expander[aria-expanded="true"]{color:var(--accent);}
.rp-caret{display:inline-block;transition:transform .18s ease;}
.rp-expander[aria-expanded="true"] .rp-caret{transform:rotate(180deg);}
.rp-detail{display:none;border-top:var(--hairw) solid var(--hair);
  padding:var(--s3) var(--s4) var(--s2) calc(var(--s4) + 3px);}
.rp-detail.open{display:block;}
.rp-detail .readout{padding-top:0;}

/* ===== panels ===== */
.panel{background:var(--panel);border:var(--hairw) solid var(--hair);
  border-radius:var(--radius);padding:var(--s4);}

/* shared hover readout (desktop detail charts) */
.readout{font-family:var(--mono);font-size:13px;color:var(--text);
  padding:var(--s2) 0 var(--s3);min-height:24px;letter-spacing:.01em;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.readout .time{color:var(--text);font-weight:600;}
.readout .dim{color:var(--faint);}

/* ===== segmented controls ===== */
.seg{display:inline-flex;background:var(--bg);border:var(--hairw) solid var(--hair);
  border-radius:8px;padding:3px;gap:2px;}
.seg button{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);
  padding:6px 12px;border-radius:6px;letter-spacing:.02em;white-space:nowrap;
  transition:background .12s,color .12s;}
.seg button:hover{color:var(--text);}
.seg button.active{background:var(--raised);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--hair);}
.seg button.active[data-accent]{color:var(--seg-accent,var(--text));}

/* run evolution (collapsible) */
.evo-expander{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
  padding:var(--s3) var(--s4);
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);}
.evo-expander:hover{color:var(--text);}
.evo-expander .rp-caret{margin-left:auto;}
.evo-expander[aria-expanded="true"] .rp-caret{transform:rotate(180deg);}
.evo-body{display:none;padding:0 var(--s4) var(--s4);}
.evo-body.open{display:block;}
/* fixed height so toggling runs/variable can't collapse the box and shift scroll */
#evoChart{min-height:260px;}

/* run evolution chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s3);}
.chip{font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--bg);border:var(--hairw) solid var(--hair);
  border-radius:6px;padding:5px 9px;cursor:pointer;letter-spacing:.02em;
  transition:border-color .12s,color .12s;}
.chip:hover{color:var(--text);}
.chip.on{color:var(--text);border-color:var(--accent,var(--precip));
  box-shadow:inset 0 0 0 1px var(--accent,var(--precip));}

/* ===== footer ===== */
.footer{margin-top:var(--s6);border-top:var(--hairw) solid var(--hair);
  padding-top:var(--s4);font-family:var(--mono);font-size:11px;color:var(--faint);
  letter-spacing:.04em;text-transform:uppercase;display:flex;
  justify-content:space-between;gap:var(--s3);flex-wrap:wrap;}

.miss{font-family:var(--mono);font-size:13px;color:var(--faint);
  padding:var(--s5) 0;text-align:center;}

/* uPlot tweaks */
.uplot{font-family:var(--mono);}
.u-axis{color:var(--faint);}
.u-cursor-x,.u-cursor-y{border-color:rgba(138,150,168,.4)!important;}
.u-cursor-pt{display:none;}
/* let vertical scroll pass through charts on touch (prevents scroll-freeze
   when a finger lands on a chart); horizontal isn't needed here */
.uplot,.u-over{touch-action:pan-y;}
.rp-chart,#evoChart{touch-action:pan-y;}

@media(max-width:480px){
  .statusbar{gap:var(--s2);}
  .sb-spacer{flex-basis:100%;height:0;}
  .sb-meta{font-size:11px;gap:var(--s3);}
}
</style>
</head>
<body>

<header class="statusbar">
  <div class="sb-id"><span class="led" id="led"></span>ICON-D2-RUC<span class="sb-loc" id="sbLoc">· BRATISLAVA</span>
    <span class="sb-degraded" id="sbDegraded" title="DWD discontinued the ensemble source (icon-d2-ruc-eps). Showing the deterministic icon-d2-ruc single member as a stopgap — percentiles and probabilities aren't meaningful until a real ensemble source is back.">SINGLE-MEMBER</span></div>
  <div class="seg" id="locSwitch"></div>
  <div class="sb-spacer"></div>
  <div class="runswitch"><select id="runSelect" aria-label="Forecast run"></select></div>
  <div class="sb-meta">
    <span>UPDATED <b id="updAgo">—</b></span>
    <span>Δ <b id="gridDist">—</b></span>
  </div>
</header>

<main class="wrap">

  <!-- ANSWER LAYER -->
  <section class="section" id="answersSec" style="margin-top:var(--s4)">
    <div class="answers" id="answers"></div>
  </section>

  <!-- RUN EVOLUTION (collapsible, secondary) -->
  <section class="section anim" style="animation-delay:.25s">
    <div class="panel" style="padding:0;overflow:hidden">
      <button class="evo-expander" id="evoToggle" aria-expanded="false" aria-controls="evoBody">
        <span>How the forecast has changed</span>
        <span class="rp-caret">▾</span>
      </button>
      <div class="evo-body" id="evoBody">
        <div class="seg" id="evoSeg" style="margin:var(--s2) 0 var(--s4)"></div>
        <div class="readout" id="evoReadout"><span class="dim">Hover the chart for values</span></div>
        <div id="evoChart"></div>
        <div class="chips" id="evoChips"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span>Model ICON-D2-RUC · single member (stopgap, was 20-member ICON-D2-RUC-EPS) · DWD OpenData</span>
    <span id="footRun">—</span>
  </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
"use strict";

/* ---------- data fetch ---------- */
async function fetchJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+': '+r.status);return r.json();}
async function fetchRuns(){
  try{
    const idx=await fetchJSON('./data/forecasts/index.json');
    if(idx.locations)locations=idx.locations;
    return idx.runs||[];
  }catch(e){
    try{fetchJSON('/api/locations').then(l=>{locations=l;buildLocSwitch();}).catch(()=>{});}catch(_){}
    return fetchJSON('/api/runs');
  }
}
async function fetchRun(id){
  try{return await fetchJSON('./data/forecasts/'+id+'_'+activeLocation+'.json');}
  catch(e){return fetchJSON('/api/runs/'+id+'/'+activeLocation);}
}

/* ---------- meta ---------- */
const VARS={
  TOT_PREC:{label:'Precipitation',short:'PRECIP',unit:'mm/h',accent:'var(--precip)',rgb:'59,158,255',dp:2,clamp:true},
  VMAX_10M:{label:'Wind gust',short:'WIND',unit:'m/s',accent:'var(--wind)',rgb:'95,182,201',dp:1,clamp:true},
  T_2M:{label:'Temperature',short:'TEMP',unit:'°C',accent:'var(--temp)',rgb:'255,180,84',dp:1,clamp:false}
};
const VAR_ORDER=['TOT_PREC','VMAX_10M','T_2M'];
const ACCENT_HEX={TOT_PREC:'#3b9eff',VMAX_10M:'#5fb6c9',T_2M:'#ffb454'};

/* ---------- helpers ---------- */
const N=v=>(v===null||v===undefined||Number.isNaN(v))?null:v;
function fmt(v,dp){v=N(v);return v===null?'—':v.toFixed(dp);}
function pct(frac){frac=N(frac);return frac===null?'—':Math.round(frac*100)+'%';}
function toXs(times){return times.map(t=>new Date(t).getTime()/1000);}
function safeArr(a){return Array.isArray(a)?a:[];}
function getVar(run,k){return run&&run.variables&&run.variables[k]?run.variables[k]:null;}

/* time axis helpers */
const hourLabels=(u,splits)=>splits.map(v=>String(new Date(v*1000).getHours()));
function hhmm(sec){return new Date(sec*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});}
function dayhm(sec){const d=new Date(sec*1000);return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+hhmm(sec);}
/* local "HH:MM" 24h from ISO string or unix-seconds */
function fmtClock(t){
  let ms;
  if(typeof t==='number'){ms=t*1000;}
  else{const d=new Date(t);ms=d.getTime();}
  if(Number.isNaN(ms))return '—';
  const d=new Date(ms);
  const h=String(d.getHours()).padStart(2,'0');
  const m=String(d.getMinutes()).padStart(2,'0');
  return h+':'+m;
}
const MS=3.6; // m/s -> km/h
/* first non-null of an array */
function firstVal(arr){for(let i=0;i<arr.length;i++){const v=N(arr[i]);if(v!==null)return {v,i};}return {v:null,i:null};}
/* argmax over full array, returns {v,i} */
function argMax(arr){let m=null,idx=null;for(let i=0;i<arr.length;i++){const v=N(arr[i]);if(v!==null&&(m===null||v>m)){m=v;idx=i;}}return {v:m,i:idx};}
function argMin(arr){let m=null,idx=null;for(let i=0;i<arr.length;i++){const v=N(arr[i]);if(v!==null&&(m===null||v<m)){m=v;idx=i;}}return {v:m,i:idx};}
function maxNonNull(arr){return argMax(arr).v;}
function minNonNull(arr){return argMin(arr).v;}
/* gentle centered moving average; nulls skipped. win<=1 is a no-op. */
function movAvgArr(arr,win){
  if(win<=1)return arr.map(N);
  const half=Math.floor(win/2),out=[];
  for(let i=0;i<arr.length;i++){let s=0,c=0;
    for(let j=i-half;j<=i+half;j++){const v=N(arr[j]);if(v!==null){s+=v;c++;}}
    out.push(c?s/c:null);}
  return out;
}

const AX_STROKE='#5b6675', GRID='rgba(35,44,58,.7)', TICK='rgba(35,44,58,.9)';
function yAxis(opts){return Object.assign({stroke:AX_STROKE,size:46,font:'11px IBM Plex Mono',
  grid:{stroke:GRID,width:1},ticks:{stroke:TICK,width:1,size:4}},opts||{});}
function xAxisCfg(showVals){return {stroke:AX_STROKE,font:'11px IBM Plex Mono',
  incrs:[3600,2*3600,3*3600,6*3600,12*3600,24*3600],space:30,
  values:showVals?hourLabels:()=>[],
  grid:{stroke:GRID,width:1},ticks:{stroke:TICK,width:1,size:4},size:showVals?34:8};}

/* ---------- global state ---------- */
const runCache={};          // id -> run object
let runIds=[];
let currentId=null;
let activeLocation='bratislava';
let locations={};           // populated from index.json
let firstRender=true;        // entrance animation only on the first paint
let evoVar='TOT_PREC';
let evoSelected=[];          // run ids included in evolution
// per-variable expand state + live uPlot instance for the answer-layer detail charts
const detailState={TOT_PREC:false,VMAX_10M:false,T_2M:false};
const detailCharts={TOT_PREC:null,VMAX_10M:null,T_2M:null};
const charts={evo:null};

/* =========================================================
   STATUS BAR
========================================================= */
function relAge(generated_at){
  if(!generated_at)return '—';
  const then=new Date(generated_at).getTime();
  if(Number.isNaN(then))return '—';
  let mins=Math.round((Date.now()-then)/60000);
  if(mins<0)mins=0;
  if(mins<60)return mins+'M AGO';
  const h=Math.floor(mins/60);if(h<24)return h+'H AGO';
  return Math.floor(h/24)+'D AGO';
}
function runLabel(id){
  // id like 2026-06-05T1200
  const date=id.slice(0,10), hh=id.slice(11,13), mm=id.slice(13,15);
  const d=new Date(date+'T00:00:00Z');
  const md=Number.isNaN(d.getTime())?date:d.toLocaleDateString([],{month:'short',day:'numeric',timeZone:'UTC'});
  return md+' · '+hh+':'+mm+' UTC';
}
function buildRunSwitch(){
  const sel=document.getElementById('runSelect');
  sel.innerHTML='';
  runIds.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=runLabel(id);sel.appendChild(o);});
  sel.value=currentId;
  sel.onchange=()=>{currentId=sel.value;renderForCurrent();};
}
function buildLocSwitch(){
  const el=document.getElementById('locSwitch');
  if(!el)return;
  el.innerHTML='';
  Object.entries(locations).forEach(([locId,locCfg])=>{
    const btn=document.createElement('button');
    btn.textContent=locCfg.name;
    btn.dataset.loc=locId;
    if(locId===activeLocation)btn.classList.add('active');
    btn.onclick=()=>switchLocation(locId);
    el.appendChild(btn);
  });
}
function switchLocation(locId){
  if(locId===activeLocation)return;
  activeLocation=locId;
  // Clear cache — each location has its own forecasts.
  Object.keys(runCache).forEach(k=>delete runCache[k]);
  document.getElementById('sbLoc').textContent='· '+(locations[locId]?.name||locId).toUpperCase();
  document.querySelectorAll('#locSwitch button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.loc===locId);
  });
  (async()=>{
    try{
      runCache[currentId]=await fetchRun(currentId);
      renderForCurrent();
      await Promise.all(runIds.filter(id=>id!==currentId).map(async id=>{
        try{runCache[id]=await fetchRun(id);}catch(e){}
      }));
      renderEvoAll();
    }catch(e){}
  })();
}
function updateStatusBar(run){
  document.getElementById('updAgo').textContent=relAge(run.generated_at);
  const gd=N(run.grid_distance_km);
  document.getElementById('gridDist').textContent=gd===null?'—':gd.toFixed(2)+' KM';
  const singleMember=Object.values(run.variables||{}).some(v=>(v.ensemble_members||[]).length===1);
  document.getElementById('sbDegraded').style.display=singleMember?'inline-block':'none';
}

/* =========================================================
   ANSWER LAYER  (rain · temperature · wind)
========================================================= */
function windStrength(kmh){
  if(kmh===null)return '';
  if(kmh<20)return 'Calm';
  if(kmh<39)return 'Breezy';
  if(kmh<62)return 'Gusty';
  if(kmh<89)return 'Strong';
  return 'Severe';
}

/* ---- build plain-language answers ---- */
function rainAnswer(run){
  const v=getVar(run,'TOT_PREC');
  if(!v)return null;
  const P=v.percentiles||{};
  const p01=safeArr(v.probability_exceeds&&v.probability_exceeds['0.1']);
  const p90=safeArr(P.p90);
  const xs=toXs(v.times);
  if(!p01.length)return null;

  // only consider future timesteps
  const nowSec=Date.now()/1000;
  const firstFuture=xs.findIndex(x=>x>=nowSec);
  if(firstFuture<0)return null;

  const lastIdx=xs.length-1;
  // 5-min precip is noisy: smooth and require a sustained dry spell
  const sub5=xs.length>50;
  const sp=movAvgArr(p01,sub5?3:1);
  const sustain=sub5?3:1;
  const ONSET=0.40, EASE=0.25;
  // p90 below this threshold is drizzle/noise not worth reporting
  const DRIZZLE_P90=0.3;

  const dry=i=>{const x=(i>lastIdx)?0:sp[i];return x===null||x<EASE;};

  // enumerate all wet windows starting from the first future step
  const wins=[];
  let i=firstFuture;
  while(i<=lastIdx){
    while(i<=lastIdx&&dry(i))i++;
    if(i>lastIdx)break;
    const onset=i;
    let endIdx=-1;
    for(let j=onset+1;j<=lastIdx;j++){
      let ok=true;for(let k=0;k<sustain;k++){if(!dry(j+k)){ok=false;break;}}
      if(ok){endIdx=j;break;}
    }
    const winEnd=endIdx>=0?endIdx:lastIdx;
    let pk90=null,pkProb=null;
    for(let j=onset;j<=winEnd;j++){
      const r=N(p90[j]);if(r!==null&&(pk90===null||r>pk90))pk90=r;
      const pr=N(sp[j]);if(pr!==null&&(pkProb===null||pr>pkProb))pkProb=pr;
    }
    wins.push({onset,end:endIdx,winEnd,pk90,pkProb});
    i=winEnd+1;
  }

  // discard drizzle windows; among real rain pick the most intense
  const real=wins.filter(w=>w.pk90!==null&&w.pk90>=DRIZZLE_P90);
  if(!real.length){
    let pk=null;
    for(let j=firstFuture;j<=lastIdx;j++){const r=N(sp[j]);if(r!==null&&(pk===null||r>pk))pk=r;}
    if(pk===null||pk<0.25)return {head:'No rain expected',sub:''};
    return {head:'No rain expected',sub:'peak chance <b>'+Math.round(pk*100)+'%</b>'};
  }
  const w=real.reduce((a,b)=>b.pk90>a.pk90?b:a);

  const prob=w.pkProb||0;
  const amt=' <span class="dim">·</span> up to <b>'+w.pk90.toFixed(1)+'</b> mm/h';

  if(prob>=ONSET){
    const tail=w.end>=0?'easing by <b>'+fmtClock(xs[w.end])+'</b>'
                       :'continuing past <b>'+fmtClock(xs[lastIdx])+'</b>';
    return {head:'Rain likely from <span class="accent">'+fmtClock(xs[w.onset])+'</span> · '+tail,
      sub:'<b>'+Math.round(prob*100)+'%</b> chance'+amt};
  }
  return {head:'Light rain possible around <span class="accent">'+fmtClock(xs[w.onset])+'</span>',
    sub:'<b>'+Math.round(prob*100)+'%</b> chance'+amt};
}

function tempAnswer(run){
  const v=getVar(run,'T_2M');
  if(!v)return null;
  const P=v.percentiles||{};
  const p50=safeArr(P.p50);
  const xs=toXs(v.times);
  const f=firstVal(p50);
  const nowT=f.v;
  if(nowT===null)return null;
  const mx=argMax(p50), mn=argMin(p50);
  const maxT=mx.v, maxIdx=mx.i, minT=mn.v, minIdx=mn.i;
  const nowIdx=f.i;

  let head='Now <span class="now">'+Math.round(nowT)+'°</span>';
  let subParts=[];
  if(maxT!==null)subParts.push('High <b>'+Math.round(maxT)+'°</b> at '+fmtClock(xs[maxIdx]));
  // low only if it occurs later than now AND is notably lower
  if(minT!==null&&minIdx>nowIdx&&(nowT-minT)>=1.5)subParts.push('Low <b>'+Math.round(minT)+'°</b> at '+fmtClock(xs[minIdx]));

  // trend ~+6h ahead. T_2M is hourly (step_minutes 60) -> +6 indices, else last.
  let trendIdx=nowIdx+6;
  if(trendIdx>xs.length-1)trendIdx=xs.length-1;
  const trendVal=N(p50[trendIdx]);
  if(trendVal!==null&&trendIdx!==nowIdx){
    const delta=trendVal-nowT;
    if(Math.abs(delta)>=1.5){
      const dir=delta>0?'rising':'falling';
      subParts.push(dir+' <b>'+Math.abs(Math.round(delta))+'°</b> by '+fmtClock(xs[trendIdx]));
    }
  }
  return {head:head,sub:subParts.join(' <span class="dim">·</span> ')};
}

function windAnswer(run){
  const v=getVar(run,'VMAX_10M');
  if(!v)return null;
  const P=v.percentiles||{};
  const p50=safeArr(P.p50), p90=safeArr(P.p90);
  const xs=toXs(v.times);
  const f=firstVal(p50);
  const nowG=f.v;
  const pk=argMax(p50); const peakG=pk.v, peakIdx=pk.i;
  if(peakG===null)return null;
  const peakKmh=peakG*MS;
  const nowKmh=nowG===null?null:nowG*MS;
  const strength=windStrength(nowKmh!==null?nowKmh:peakKmh);

  const head='Gusts to <span class="accent">'+Math.round(peakKmh)+' km/h</span> around '
    +fmtClock(xs[peakIdx])+' <span class="dim">('+peakG.toFixed(1)+' m/s)</span>';
  let sub='';
  if(nowKmh!==null)sub='Now <b>'+Math.round(nowKmh)+' km/h</b> <span class="dim">·</span> '+strength;
  else sub=strength;
  return {head:head,sub:sub};
}

/* ---- render the three readout panels + expanders ---- */
const ANSWER_FNS={TOT_PREC:rainAnswer,T_2M:tempAnswer,VMAX_10M:windAnswer};
// answer-layer order: Rain, Temperature, Wind
const ANSWER_ORDER=['TOT_PREC','T_2M','VMAX_10M'];

function renderAnswers(run){
  // destroy any live detail charts before rebuilding
  VAR_ORDER.forEach(vk=>{
    if(detailCharts[vk]){try{detailCharts[vk].destroy();}catch(e){}detailCharts[vk]=null;}
  });
  const host=document.getElementById('answers');host.innerHTML='';

  ANSWER_ORDER.forEach((vk,idx)=>{
    const m=VARS[vk];
    const present=!!getVar(run,vk);
    const ans=present?ANSWER_FNS[vk](run):null;

    const panel=document.createElement('div');
    panel.className='readout-panel'+(firstRender?' anim':'');
    panel.dataset.vk=vk;
    panel.style.setProperty('--accent',m.accent);
    if(firstRender)panel.style.animationDelay=(0.04+idx*0.06).toFixed(2)+'s';

    if(!present||!ans){
      panel.classList.add('rp-miss');
      panel.innerHTML=
        '<div class="rp-body"><div class="rp-top"><span class="rp-tag">'+m.label+'</span></div>'
        +'<div class="rp-head">not available</div></div>';
      host.appendChild(panel);
      return;
    }

    panel.innerHTML=
      '<div class="rp-body">'
        +'<div class="rp-top"><span class="rp-tag">'+m.label+'</span><span class="rp-unit">'+m.unit+'</span></div>'
        +'<div class="rp-head">'+ans.head+'</div>'
        +(ans.sub?'<div class="rp-sub">'+ans.sub+'</div>':'')
      +'</div>'
      +'<button class="rp-expander" aria-expanded="'+(detailState[vk]?'true':'false')+'">'
        +'<span class="rp-caret">▾</span><span>DETAIL</span></button>'
      +'<div class="rp-detail'+(detailState[vk]?' open':'')+'">'
        +'<div class="readout"><span class="dim">Hover the chart for values</span></div>'
        +'<div class="rp-chart"></div>'
      +'</div>';
    host.appendChild(panel);

    const btn=panel.querySelector('.rp-expander');
    const det=panel.querySelector('.rp-detail');
    const chartHost=panel.querySelector('.rp-chart');
    const ro=panel.querySelector('.readout');

    btn.addEventListener('click',()=>{
      const open=!detailState[vk];
      detailState[vk]=open;
      btn.setAttribute('aria-expanded',open?'true':'false');
      det.classList.toggle('open',open);
      if(open){
        renderDetailChart(vk,run,chartHost,ro);
      }else if(detailCharts[vk]){
        try{detailCharts[vk].destroy();}catch(e){}detailCharts[vk]=null;
      }
    });

    // if it was already expanded (e.g. run switch), render now
    if(detailState[vk])renderDetailChart(vk,run,chartHost,ro);
  });
  firstRender=false;
}

/* ---- expandable per-variable ensemble chart ---- */
/* p50 median + p25–p75 band + p10–p90 (fainter) band. Wind in km/h. */
function renderDetailChart(vk,run,host,ro){
  if(detailCharts[vk]){try{detailCharts[vk].destroy();}catch(e){}detailCharts[vk]=null;}
  if(!host)return;
  host.innerHTML='';
  const m=VARS[vk];const v=getVar(run,vk);
  if(!v){host.innerHTML='<div class="miss">Variable not available in this run.</div>';if(ro)ro.innerHTML='';return;}
  const width=host.clientWidth||(document.querySelector('.wrap').clientWidth-32);
  const xs=toXs(v.times);const P=v.percentiles||{};
  const scale=(vk==='VMAX_10M')?MS:1; // wind -> km/h
  const conv=a=>safeArr(a).map(x=>{x=N(x);return x===null?null:x*scale;});
  const p10=conv(P.p10),p90=conv(P.p90),p25=conv(P.p25),p75=conv(P.p75),p50=conv(P.p50);
  const accent=ACCENT_HEX[vk];const rgb=m.rgb;
  const unit=(vk==='VMAX_10M')?'km/h':m.unit;
  const dp=(vk==='VMAX_10M')?0:m.dp;

  // series: x, p10, p90, p25, p75, p50  with two bands
  const data=[xs,p10,p90,p25,p75,p50];
  const series=[{},
    {stroke:'transparent',points:{show:false}},
    {stroke:'transparent',points:{show:false}},
    {stroke:'transparent',points:{show:false}},
    {stroke:'transparent',points:{show:false}},
    {stroke:accent,width:2.2,points:{show:false}}];
  const bands=[{series:[2,1],fill:'rgba('+rgb+',.10)'},   // p10–p90 fainter
               {series:[4,3],fill:'rgba('+rgb+',.20)'}];  // p25–p75

  // y-axis: precip & wind -> [0, max(1, maxP90+1)]; temp -> padded
  let yScale;
  if(m.clamp){
    const maxP90=(maxNonNull(p90)!==null?maxNonNull(p90):maxNonNull(p50));
    const top=Math.max(1,(maxP90===null?0:maxP90)+1);
    yScale={range:()=>[0,top]};
  }else{
    const dispMax=maxNonNull(p90)!==null?maxNonNull(p90):maxNonNull(p50);
    const dispMin=minNonNull(p10)!==null?minNonNull(p10):minNonNull(p50);
    if(dispMax!==null&&dispMin!==null){
      const pad=Math.max(1,(dispMax-dispMin)*0.1);
      yScale={range:[dispMin-pad,dispMax+pad]};
    }else yScale={};
  }

  function syncReadout(i){
    if(!ro)return;
    if(i==null){ro.innerHTML='<span class="dim">Hover the chart for values</span>';return;}
    const parts=['<span class="time">'+dayhm(xs[i])+'</span>'];
    parts.push('<span style="color:'+accent+'">p50 '+fmt(p50[i],dp)+' '+unit+'</span>');
    if(p25.length&&p75.length)parts.push('<span class="dim">p25–75 '+fmt(p25[i],dp)+'–'+fmt(p75[i],dp)+'</span>');
    if(p10.length&&p90.length)parts.push('<span class="dim">p10–90 '+fmt(p10[i],dp)+'–'+fmt(p90[i],dp)+'</span>');
    ro.innerHTML=parts.join('<span class="dim">·</span>');
  }

  const opts={
    width:width,height:260,
    cursor:{x:true,y:true,points:{show:false},drag:{x:false,y:false}},
    legend:{show:false},
    scales:{x:{time:false},y:yScale},
    axes:[xAxisCfg(true),yAxis({values:(u,vals)=>vals.map(x=>x.toFixed(dp===2?1:0))})],
    series:series,
    bands:bands,
    padding:[12,12,2,0],
    hooks:{setCursor:[(u)=>{syncReadout(u.cursor.idx);}]}
  };
  detailCharts[vk]=new uPlot(opts,data,host);
}

/* =========================================================
   RUN EVOLUTION
========================================================= */
/* run a re-render without letting the viewport jump: rebuilding controls or the
   chart can make mobile browsers scroll (focus loss / relayout). Pin scroll now
   and again next frame to swallow any async scroll-into-view. */
function keepScroll(fn){
  const x=window.scrollX,y=window.scrollY;
  fn();
  window.scrollTo(x,y);
  requestAnimationFrame(()=>window.scrollTo(x,y));
}
function buildEvoSeg(){
  const host=document.getElementById('evoSeg');host.innerHTML='';
  VAR_ORDER.forEach(vk=>{
    const b=document.createElement('button');b.textContent=VARS[vk].label;b.dataset.vk=vk;
    if(vk===evoVar)b.classList.add('active');
    b.onclick=()=>{evoVar=vk;[...host.children].forEach(c=>c.classList.toggle('active',c.dataset.vk===vk));keepScroll(()=>{renderEvo();buildEvoChips();});};
    host.appendChild(b);
  });
}
function buildEvoChips(){
  const host=document.getElementById('evoChips');host.innerHTML='';
  const accent=ACCENT_HEX[evoVar];
  runIds.forEach(id=>{
    const c=document.createElement('button');c.className='chip';c.textContent=runLabel(id);
    if(evoSelected.includes(id)){c.classList.add('on');c.style.setProperty('--accent',accent);}
    c.onclick=()=>{
      const i=evoSelected.indexOf(id);
      // toggle this chip in place (don't rebuild all chips -> keeps focus, no jump)
      if(i>=0){evoSelected.splice(i,1);c.classList.remove('on');c.style.removeProperty('--accent');}
      else{evoSelected.push(id);c.classList.add('on');c.style.setProperty('--accent',accent);}
      keepScroll(renderEvo);
    };
    host.appendChild(c);
  });
}
function renderEvo(){
  if(charts.evo){try{charts.evo.destroy();}catch(e){}charts.evo=null;}
  if(!evoOpen)return; // no live instance while collapsed
  const host=document.getElementById('evoChart');host.innerHTML='';
  const ro=document.getElementById('evoReadout');
  const m=VARS[evoVar];const accent=ACCENT_HEX[evoVar];
  const scale=(evoVar==='VMAX_10M')?MS:1;          // wind -> km/h everywhere
  const edp=(evoVar==='VMAX_10M')?0:m.dp;
  // ordered newest-first among selected, that are actually loaded
  const sel=runIds.filter(id=>evoSelected.includes(id)&&runCache[id]&&(getVar(runCache[id],evoVar)||{times:[]}).times.length>0);
  if(!sel.length){host.innerHTML='<div class="miss">No runs selected (or variable missing).</div>';ro.innerHTML='';return;}
  const width=host.clientWidth||document.querySelector('.wrap').clientWidth-32;

  // common x grid from the newest selected run
  const baseRun=runCache[sel[0]];const baseV=getVar(baseRun,evoVar);
  const baseXs=toXs(baseV.times);
  // build per-run interpolated/aligned p50 to base time index by nearest time
  const seriesData=[baseXs];
  const seriesCfg=[{}];
  const labels=[];
  sel.forEach((id,idx)=>{
    const v=getVar(runCache[id],evoVar);
    const xs=toXs(v.times);const p50=safeArr(v.percentiles&&v.percentiles.p50);
    // tolerance = half this run's own step, so a base point matches only a
    // genuinely coincident source point. A larger tol would re-use a run's last
    // value one extra step past its end, drawing a flat horizontal stub (the
    // staircase artifact). Derived from the data, so it's unit-agnostic and
    // works for both hourly (temp/wind) and 5-min (precip) grids.
    let step=Infinity;
    for(let i=1;i<xs.length;i++){const dx=xs[i]-xs[i-1];if(dx>0&&dx<step)step=dx;}
    const tol=(isFinite(step)?step:3600)*0.5;
    // map base xs -> nearest p50 of this run (only where genuinely coincident)
    const aligned=baseXs.map(bx=>{
      let best=null,bd=Infinity;
      for(let i=0;i<xs.length;i++){const d=Math.abs(xs[i]-bx);if(d<bd){bd=d;best=i;}}
      const raw=(best!==null&&bd<=tol)?N(p50[best]):null;
      return raw===null?null:raw*scale;
    });
    seriesData.push(aligned);
    const newest=idx===0;
    const alpha=Math.max(0.18,1-idx*0.22);
    seriesCfg.push({stroke:'rgba('+m.rgb+','+alpha.toFixed(2)+')',
      width:newest?2.6:1.4,points:{show:false}});
    labels.push(id);
  });

  function syncReadout(i){
    if(i==null){ro.innerHTML='<span class="dim">Hover the chart for values</span>';return;}
    const parts=['<span class="time">'+dayhm(baseXs[i])+'</span>'];
    sel.forEach((id,k)=>{
      const val=seriesData[k+1][i];
      if(val!==null)parts.push('<span style="color:rgba('+m.rgb+','+Math.max(.4,1-k*0.22).toFixed(2)+')">'+id.slice(11,13)+':'+id.slice(13,15)+' '+fmt(val,edp)+'</span>');
    });
    ro.innerHTML=parts.join('<span class="dim">·</span>');
  }

  const yScale=m.clamp?{range:(u,min,max)=>[0,Math.max(max,m.dp===2?0.2:1)]}:{};
  const opts={
    width:width,height:260,
    cursor:{x:true,y:true,points:{show:false},drag:{x:false,y:false}},
    legend:{show:false},
    scales:{x:{time:false},y:yScale},
    axes:[xAxisCfg(true),yAxis({values:(u,vals)=>vals.map(x=>x.toFixed(m.dp===2?1:0))})],
    series:seriesCfg,
    padding:[12,12,2,0],
    hooks:{setCursor:[(u)=>{syncReadout(u.cursor.idx);}]}
  };
  charts.evo=new uPlot(opts,seriesData,host);
}

/* =========================================================
   ORCHESTRATION
========================================================= */
let evoOpen=false;
function renderForCurrent(){
  const run=runCache[currentId];
  if(!run)return;
  updateStatusBar(run);
  renderAnswers(run);
  document.getElementById('footRun').textContent='RUN '+currentId;
}

function renderEvoAll(){buildEvoSeg();buildEvoChips();if(evoOpen)renderEvo();}

function setupEvoToggle(){
  const btn=document.getElementById('evoToggle');
  const body=document.getElementById('evoBody');
  btn.addEventListener('click',()=>{
    evoOpen=!evoOpen;
    btn.setAttribute('aria-expanded',evoOpen?'true':'false');
    body.classList.toggle('open',evoOpen);
    if(evoOpen)renderEvo();
    else if(charts.evo){try{charts.evo.destroy();}catch(e){}charts.evo=null;}
  });
}

async function init(){
  try{
    runIds=await fetchRuns();
  }catch(e){
    document.body.insertAdjacentHTML('beforeend','<div class="miss">Failed to load run index: '+e.message+'</div>');
    document.getElementById('led').style.background='var(--alert)';
    document.getElementById('led').style.boxShadow='0 0 8px rgba(255,92,92,.7)';
    return;
  }
  if(!runIds.length){document.body.insertAdjacentHTML('beforeend','<div class="miss">No runs available.</div>');return;}
  currentId=runIds[0];
  evoSelected=runIds.slice(0,4);

  // load newest run first, render
  try{runCache[currentId]=await fetchRun(currentId);}catch(e){
    document.body.insertAdjacentHTML('beforeend','<div class="miss">Failed to load run '+currentId+': '+e.message+'</div>');return;
  }
  buildRunSwitch();
  buildLocSwitch();
  setupEvoToggle();
  renderForCurrent();

  // evolution scaffold (chips need labels even before loads)
  buildEvoSeg();buildEvoChips();

  // lazy-load remaining runs, then render evolution
  const rest=runIds.filter(id=>id!==currentId);
  await Promise.all(rest.map(async id=>{
    try{runCache[id]=await fetchRun(id);}catch(e){/* skip failed */}
  }));
  renderEvoAll();
}

/* responsive: only react to real WIDTH changes. Mobile browsers fire `resize`
   on every URL-bar show/hide (height changes, width doesn't) — reacting to those
   caused the scroll flicker. And relayout via uPlot setSize instead of
   destroy+recreate, so there's no flash. */
let rzTimer=null;
let lastW=window.innerWidth;
function fitChart(u,host){
  if(!u)return;
  const w=(host&&host.clientWidth)||u.width;
  if(w&&w!==u.width)u.setSize({width:w,height:260});
}
window.addEventListener('resize',()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{
    const w=window.innerWidth;
    if(w===lastW)return;            // height-only (URL bar) — ignore
    lastW=w;
    ANSWER_ORDER.forEach(vk=>{
      if(!detailCharts[vk])return;
      const panel=document.querySelector('.readout-panel[data-vk="'+vk+'"]');
      fitChart(detailCharts[vk],panel&&panel.querySelector('.rp-chart'));
    });
    fitChart(charts.evo,document.getElementById('evoChart'));
  },200);
},{passive:true});

init();
</script>
